name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.16.0'

      - run: zig fmt --check .

      - run: zig build

      - run: zig build -Doptimize=ReleaseSafe
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.16.0'

      - name: Run unit tests
        run: zig build test --summary all
  smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.16.0'

      - name: Install smoke test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 grub-pc-bin xorriso mtools

      - name: Smoke test (Debug)
        run: ./scripts/smoke.sh

      - name: Smoke test (ReleaseSafe)
        run: ./scripts/smoke.sh ReleaseSafe
